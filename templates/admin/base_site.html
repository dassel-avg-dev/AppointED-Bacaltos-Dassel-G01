{% extends "admin/base.html" %}
{% load static %}
{% block title %}{{ title }} | AppointED Admin{% endblock %}
{% block extrastyle %}{{ block.super }}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="{% static 'img/logo-mark.svg' %}">

{% block branding %}

{% endblock %}
{% block nav-global %}<a href="/" style="margin-left:1rem;font-size:.82rem;">← Back to site</a>{% endblock %}
