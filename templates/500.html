<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Server Error · AppointED</title>
  <style>
    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #f3f6fb;
      color: #172d50;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      max-width: 34rem;
      width: 100%;
      background: #ffffff;
      border: 1px solid #e2e9f4;
      border-radius: 14px;
      padding: 2.75rem 2.5rem;
      box-shadow: 0 1px 2px rgba(16, 42, 86, 0.04);
    }
    .code {
      display: inline-block;
      background: #f8e7df;
      color: #9d4937;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 6px 10px;
      border-radius: 12px;
    }
    .numeral {
      font-family: Georgia, serif;
      font-size: 56px;
      line-height: 1;
      margin: 14px 0 8px 0;
      color: #172d50;
    }
    h1 {
      font-family: Georgia, serif;
      font-weight: 400;
      font-size: 28px;
      margin: 0 0 8px 0;
    }
    p { font-size: 14px; color: #526177; margin: 0 0 1.5rem 0; line-height: 1.45; }
    a {
      display: inline-block;
      background: #183f7d;
      color: #ffffff;
      text-decoration: none;
      padding: 11px 16px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="code">500 · Server error</span>
    <p class="numeral">500</p>
    <h1>Something went wrong on our end</h1>
    <p>Please try again in a moment or return to the home page.</p>
    <a href="/">Try again</a>
  </div>
</body>
</html>
