{% load ui %}
<div class="field">
  <label for="{{ f.id_for_label }}" class="field-label">{{ f.label }}</label>
  {{ f }}
  {% if f.help_text %}<p class="field-help">{{ f.help_text }}</p>{% endif %}
  {% for err in f.errors %}
    <p class="field-error" role="alert">{% icon "exclamation" "w-4 h-4 shrink-0" %}<span>{{ err }}</span></p>
  {% endfor %}
</div>
