{% extends "base.html" %}
{% block title %}My Profile · AppointED{% endblock %}
{% block content %}
<div class="card max-w-xl mx-auto p-6 sm:p-8">
  <h1 class="text-xl font-bold mb-1">My Profile</h1>
  <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">Update your account details.</p>
  <form method="post" class="space-y-4">{% csrf_token %}
    {% for f in form %}{% include "_field.html" %}{% endfor %}
    <button class="btn btn-primary">Save changes</button>
  </form>
</div>
{% endblock %}
