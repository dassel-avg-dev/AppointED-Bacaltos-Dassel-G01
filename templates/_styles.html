<style type="text/tailwindcss">
  @custom-variant dark (&:where(.dark, .dark *));
  @layer components {
    .card {
      @apply bg-white dark:bg-slate-900 rounded-2xl ring-1 ring-slate-200 dark:ring-slate-800 shadow-sm;
    }
    .btn {
      @apply inline-flex items-center justify-center gap-2 rounded-xl px-4 py-2 text-sm font-medium transition focus:outline-none focus:ring-2 focus:ring-indigo-500 disabled:opacity-50;
    }
    .btn-sm {
      @apply rounded-lg px-3 py-1.5 text-xs;
    }
    .btn-primary {
      @apply bg-indigo-600 text-white hover:bg-indigo-700 dark:bg-indigo-500 dark:hover:bg-indigo-400;
    }
    .btn-secondary {
      @apply bg-slate-100 text-slate-700 hover:bg-slate-200 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700;
    }
    .btn-success {
      @apply bg-emerald-600 text-white hover:bg-emerald-700;
    }
    .btn-danger {
      @apply bg-rose-600 text-white hover:bg-rose-700;
    }
    .input {
      @apply w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 px-3.5 py-2.5 text-sm text-slate-900 dark:text-slate-100 placeholder-slate-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/30;
    }
    .label {
      @apply block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5;
    }
    .badge {
      @apply inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-semibold ring-1 ring-inset;
    }
    .badge-pending {
      @apply bg-amber-50 text-amber-800 ring-amber-600/20 dark:bg-amber-950/60 dark:text-amber-300 dark:ring-amber-500/30;
    }
    .badge-approved {
      @apply bg-blue-50 text-blue-800 ring-blue-600/20 dark:bg-blue-950/60 dark:text-blue-300 dark:ring-blue-500/30;
    }
    .badge-completed {
      @apply bg-emerald-50 text-emerald-800 ring-emerald-600/20 dark:bg-emerald-950/60 dark:text-emerald-300 dark:ring-emerald-500/30;
    }
    .badge-cancelled {
      @apply bg-slate-100 text-slate-600 ring-slate-500/20 dark:bg-slate-800 dark:text-slate-400 dark:ring-slate-600/30;
    }
    .avatar {
      @apply inline-flex items-center justify-center rounded-full bg-indigo-100 text-indigo-700 dark:bg-indigo-950 dark:text-indigo-300 font-semibold text-xs shrink-0;
    }
  }
</style>
<style>
  @keyframes flash-out {
    0%, 88% { opacity: 1; }
    100% { opacity: 0; max-height: 0; margin: 0; padding: 0; overflow: hidden; border: 0; }
  }
  .flash { animation: flash-out 0.4s ease 6s forwards; }
</style>
