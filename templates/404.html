{% extends "base.html" %}
{% load ui %}
{% block title %}Page Not Found · AppointED{% endblock %}
{% block content %}
<section class="error-center-card">
  <div><span class="pill-dept">404 · Not found</span></div>
  <p class="error-code">404</p>
  <h1 class="page-title">We couldn't find that page</h1>
  <p class="page-subtitle" style="font-size:14px;">The link may be broken or the item may belong to another account.</p>
  <div class="action-row" style="padding-top:4px;">
    <a href="{% url 'scheduling:dashboard' %}" class="btn btn-primary">{% icon "home" "w-4 h-4" %}<span>Go to my dashboard</span></a>
  </div>
</section>
{% endblock %}
