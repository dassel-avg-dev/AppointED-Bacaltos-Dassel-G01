{% load ui %}
{% for m in messages %}
  <div class="flash-item">
    <input type="checkbox" id="msg-{{ forloop.counter }}" class="flash-dismiss sr-only">
    <div class="toast-banner {% if 'error' in m.tags %}is-error{% endif %}" role="{% if 'error' in m.tags %}alert{% else %}status{% endif %}" aria-live="polite">
      <span style="display:inline-flex;align-items:center;gap:8px;">
        {% if 'error' in m.tags %}{% icon "exclamation" "w-4 h-4 shrink-0" %}{% else %}{% icon "check-circle" "w-4 h-4 shrink-0" %}{% endif %}
        <span>{{ m }}</span>
      </span>
      <label for="msg-{{ forloop.counter }}" class="toast-dismiss-btn" aria-label="Dismiss notification">×</label>
    </div>
  </div>
{% endfor %}
